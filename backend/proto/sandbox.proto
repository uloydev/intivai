syntax = "proto3";

package sandbox;

option go_package = "github.com/intivai/backend/internal/sandbox/proto";

// SandboxService executes untrusted code in throwaway containers. The sidecar
// owns the Docker socket; the app never does (ADR-0002).
service SandboxService {
  rpc Execute(ExecutionRequest) returns (ExecutionResult);
}

message TestCase {
  string id = 1;
  string input = 2;
  string expected_output = 3;
  bool hidden = 4;
}

message ExecutionRequest {
  // go | python | typescript | javascript — selects the per-language image
  string language = 1;
  string code = 2;
  string stdin = 3;
  repeated TestCase test_cases = 4;
  // per-case wall-clock timeout, 1..10 seconds
  int32 timeout_sec = 5;
}

message TestCaseResult {
  string test_case_id = 1;
  string input = 6;
  string expected_output = 7;
  string actual_output = 2;
  bool passed = 3;
  int64 duration_ms = 4;
  string error = 5;
}

message ExecutionResult {
  string stdout = 1;
  string stderr = 2;
  int32 exit_code = 3;
  int64 duration_ms = 4;
  bool all_passed = 5;
  repeated TestCaseResult test_results = 6;
  string error = 7;
}
