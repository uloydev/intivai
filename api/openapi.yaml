openapi: 3.0.3
info:
  title: Intivai API
  version: 0.3.0
  description: AI interviewer backend — auth, jobs, CV pipeline, screening, context.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Register an org with its admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, admin_email, admin_password]
              properties:
                name: { type: string }
                slug: { type: string }
                admin_email: { type: string, format: email }
                admin_password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      org_id: { type: string, format: uuid }
                      user_id: { type: string, format: uuid }
                      slug: { type: string }
                      plan: { type: string }
        "400": { description: "Validation error (code: WEAK_PASSWORD, ORG_SLUG_TAKEN, EMAIL_TAKEN)" }
  /auth/login:
    post:
      summary: Login with org slug + email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_slug, email, password]
              properties:
                org_slug: { type: string }
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      expires_at: { type: string, format: date-time }
                      user:
                        type: object
                        properties:
                          user_id: { type: string, format: uuid }
                          org_id: { type: string, format: uuid }
                          role: { type: string, enum: [admin, recruiter, interviewer, member] }
        "401": { description: AUTH_FAILED }
  /me:
    get:
      summary: Current user identity
      security: [bearerAuth]
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id: { type: string, format: uuid }
                      org_id: { type: string, format: uuid }
                      role: { type: string }
                      time: { type: string, format: date-time }
  /users:
    post:
      summary: Create tenant user (admin/recruiter only)
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role, password]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, recruiter, interviewer, member] }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id: { type: string, format: uuid }
                      role: { type: string }
        "400": { description: WEAK_PASSWORD / INVALID_ROLE / EMAIL_TAKEN }
        "403": { description: FORBIDDEN }
  /jobs:
    get:
      summary: List org jobs
      security: [bearerAuth]
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
    post:
      summary: Create job (admin/recruiter)
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCreate" }
      responses:
        "201": { description: Created }
        "400": { description: JOB_TITLE_REQUIRED / JOB_DESC_REQUIRED }
  /jobs/{id}:
    get:
      summary: Get job
      security: [bearerAuth]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Job }
        "404": { description: Not found }
    patch:
      summary: Partial update (nil fields kept)
      security: [bearerAuth]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobUpdate" }
      responses:
        "200": { description: Updated }
        "400": { description: Validation error }
  /cvs:
    post:
      summary: "Upload CV (multipart: file, name, email)"
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file: { type: string, format: binary }
                name: { type: string }
                email: { type: string, format: email }
      responses:
        "201":
          description: Accepted — async pipeline starts (parse_cv)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string }
        "413": { description: File too large }
    get:
      summary: List candidates (summary only — no raw text / structured PII)
      security: [bearerAuth]
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        email: { type: string }
                        status:
                          type: string
                          enum: [new, parsing, parsed, extracting, extracted, failed_ocr, failed_extract]
                        cv_ocr_method: { type: string }
                        error_message: { type: string }
                        created_at: { type: string, format: date-time }
  /cvs/{id}:
    get:
      summary: Candidate detail (raw text + structured)
      security: [bearerAuth]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Detail }
        "404": { description: Not found }
  /cvs/{id}/extract:
    post:
      summary: Re-trigger extraction (only parsed / failed_extract candidates)
      security: [bearerAuth]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Enqueued }
        "400": { description: CANDIDATE_NOT_RETRYABLE }
  /screenings:
    post:
      summary: Create application + trigger async scoring
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_id, job_id]
              properties:
                candidate_id: { type: string, format: uuid }
                job_id: { type: string, format: uuid }
      responses:
        "201": { description: Created (or re-triggered) }
        "400": { description: CANDIDATE_NOT_READY / JOB_NOT_ACTIVE }
        "404": { description: candidate/job not found }
  /applications:
    get:
      summary: List applications (optional ?job_id filter)
      security: [bearerAuth]
      parameters:
        - { name: job_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Applications (rows enriched with candidate_name, candidate_email, job_title)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        candidate_id: { type: string, format: uuid }
                        job_id: { type: string, format: uuid }
                        status: { type: string, enum: [screening, passed, rejected] }
                        cv_score: { type: number }
                        passed_screening: { type: boolean }
                        stage: { type: string }
                        recruiter_notes: { type: string }
  /applications/{id}:
    patch:
      summary: Update recruiter lifecycle stage + hiring notes (PATCH semantics — omitted fields keep their value)
      security: [bearerAuth]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                stage: { type: string, enum: [applied, screening_passed, interview_invited, interview_completed, offer_extended, hired, rejected] }
                recruiter_notes: { type: string }
      responses:
        "200":
          description: Updated application row
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      stage: { type: string }
                      recruiter_notes: { type: string }
        "400": { description: nothing to update / invalid body }
        "404": { description: application not found }
  /orgs/{orgId}/contexts:
    post:
      summary: Upload company context (json text OR multipart file); sha256 dedup + versioning
      security: [bearerAuth]
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 65536 }
      responses:
        "201": { description: Created or deduped }
        "400": { description: CTX_EMPTY / CTX_TOO_LARGE / CTX_INJECTION }
        "403": { description: org mismatch }
    get:
      summary: List org contexts (versioned)
      security: [bearerAuth]
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Contexts }
  /orgs/{orgId}/prompt:
    get:
      summary: Latest tenant prompt (default fallback when unset)
      security: [bearerAuth]
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Prompt
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      system_prompt: { type: string }
                      version: { type: integer }
    put:
      summary: Set tenant prompt (versioned; injection rails)
      security: [bearerAuth]
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [system_prompt]
              properties:
                system_prompt: { type: string, maxLength: 4000 }
      responses:
        "200": { description: Set }
        "400": { description: PROMPT_INJECTION / PROMPT_TOO_LONG }
  /interviews:
    post:
      summary: Create interview for a passed application (recruiter) — generates CV-gap questions + 7-day invitation token
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application_id]
              properties:
                application_id: { type: string, format: uuid }
                question_count: { type: integer, default: 5 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      interview_id: { type: string, format: uuid }
                      invitation_token: { type: string }
                      expires_at: { type: string, format: date-time }
        "400": { description: APPLICATION_NOT_PASSED / JOB_NOT_ACTIVE }
  /interviews:
    get:
      summary: List org interviews (recruiter) — candidate/job context + evaluation summary
      security: [bearerAuth]
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        interview_id: { type: string, format: uuid }
                        status: { type: string }
                        candidate_id: { type: string, format: uuid }
                        candidate_name: { type: string }
                        job_title: { type: string }
                        evaluation: { type: object, nullable: true }
                        created_at: { type: string, format: date-time }
  /interviews/{id}:
    get:
      summary: Interview detail — questions, answers, status, evaluation (recruiter)
      security: [bearerAuth]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      interview_id: { type: string, format: uuid }
                      status: { type: string }
                      context_version: { type: integer }
                      total_questions: { type: integer }
                      questions: { type: array, items: { type: object } }
                      answers: { type: array, items: { type: object } }
                      evaluation: { type: object, nullable: true }
                      candidate: { type: object, properties: { id: { type: string }, name: { type: string }, email: { type: string } } }
                      job: { type: object, properties: { id: { type: string }, title: { type: string } } }
                      completed_at: { type: string, format: date-time, nullable: true }
        "403": { description: FORBIDDEN — interview belongs to another org }
        "404": { description: Not found }
  /candidates/{id}/report:
    get:
      summary: Candidate report — candidate + all interviews with evaluations (recruiter)
      security: [bearerAuth]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      candidate: { type: object, properties: { id: { type: string }, name: { type: string }, email: { type: string } } }
                      interviews: { type: array, items: { type: object } }
        "403": { description: FORBIDDEN — candidate belongs to another org }
        "404": { description: Not found }
  /public/jobs:
    get:
      summary: Public job board listings (no auth required)
      responses:
        "200":
          description: Active job openings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
  /public/jobs/{id}:
    get:
      summary: Public job detail (no auth required)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Active job detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
        "404": { description: Job not found or inactive }
  /public/jobs/{id}/apply:
    post:
      summary: Direct public job application submission (multipart form)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, email, file]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Application received and queued for AI screening
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      candidate_id: { type: string, format: uuid }
  /public/candidate/auth/otp:
    post:
      summary: Request passwordless 6-digit OTP code and magic link for candidate portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Verification code sent to candidate email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      email: { type: string, format: email }
                      expires_in: { type: integer }
        "429": { description: Too many requests — wait before requesting another code }
  /public/candidate/auth/verify:
    post:
      summary: Verify candidate OTP code (or magic-link token) and receive 7-day candidate JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                email: { type: string, format: email }
                code: { type: string, minLength: 6, maxLength: 6 }
                token: { type: string, description: magic-link token (alternative to email+code) }
      responses:
        "200":
          description: Candidate authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      email: { type: string, format: email }
                      expires_at: { type: string, format: date-time }
        "400": { description: Provide either (email + code) or magic token }
        "401": { description: Invalid or expired verification code }
        "429": { description: Too many attempts — request a new code }
  /candidate/portal/applications:
    get:
      summary: List all applications and live screening/interview progress for authenticated candidate
      security: [candidateBearerAuth]
      responses:
        "200":
          description: List of candidate applications across organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        application_id: { type: string, format: uuid }
                        org_id: { type: string, format: uuid }
                        org_name: { type: string }
                        org_slug: { type: string }
                        job_id: { type: string, format: uuid }
                        job_title: { type: string }
                        job_location: { type: string }
                        job_employment_type: { type: string }
                        candidate_id: { type: string, format: uuid }
                        candidate_name: { type: string }
                        candidate_email: { type: string, format: email }
                        cv_score: { type: number, nullable: true }
                        passed_screening: { type: boolean, nullable: true }
                        application_status: { type: string }
                        applied_at: { type: string, format: date-time }
                        interview_id: { type: string, format: uuid, nullable: true }
                        interview_status: { type: string, nullable: true }
                        interview_type: { type: string, nullable: true }
                        invitation_token: { type: string, nullable: true }
                        overall_score: { type: number, nullable: true }
                        recommendation: { type: string, nullable: true }
        "401": { description: Missing or invalid candidate authorization token }
  /candidate/interviews/{id}/consent:
    post:
      summary: Record candidate GDPR consent (invitation token) — chat refuses to start without it
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitation_token]
              properties:
                invitation_token: { type: string }
      responses:
        "200": { description: consent_given: true (idempotent) }
        "400": { description: TOKEN_INVALID / TOKEN_MISMATCH }
  /candidate/interviews/{id}/ticket:
    post:
      summary: Exchange invitation token for a 10-min WS ticket (candidate, public)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitation_token]
              properties:
                invitation_token: { type: string }
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket: { type: string }
                      session_id: { type: string, format: uuid }
                      expires_at: { type: string, format: date-time }
        "400": { description: TOKEN_INVALID / TOKEN_EXPIRED / TOKEN_REVOKED / TOKEN_MISMATCH }
  /candidate/interviews/{id}/telemetry:
    post:
      summary: Ingest anti-cheating & proctoring telemetry events (HTTP/beacon fallback)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type]
              properties:
                ticket: { type: string }
                invitation_token: { type: string }
                event_type: { type: string }
                timestamp: { type: string, format: date-time }
                question_idx: { type: integer }
                details: { type: object }
      responses:
        "200": { description: Telemetry recorded }
        "400": { description: Invalid payload }
        "401": { description: Unauthorized }
  /candidate/interviews/{id}/chat:
    get:
      summary: WebSocket chat (candidate, ws_ticket in Authorization header)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Authorization, in: header, required: true, schema: { type: string } }
      responses:
        "101":
          description: Switching Protocols — frames: interview.start {session_id, total_questions, session_budget_sec}, question {idx, content, archetype, time_limit_sec, session_remaining_sec}, token, response, answer {idx, content, pacing_telemetry: {time_to_first_keystroke_ms, duration_ms, typed_chars, pasted_chars, pasted_ratio}}, evaluation {scores, overall, recommendation, status: complete|pending}, error {code, message}
        "401": { description: missing/invalid ws ticket or not bound to this interview }
        "403": { description: origin not allowed }
  /interviews/{id}/voice:
    get:
      summary: WebSocket WebRTC audio signaling (SDP offer/answer, ICE candidates)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "101":
          description: Switching Protocols — frames offer, answer, candidate
        "400": { description: invalid interview id }
  /sandbox/execute:
    post:
      summary: Execute candidate code against test suites in isolated sandbox (Go, Python, TypeScript, JS)
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, code]
              properties:
                language: { type: string, enum: [go, python, typescript, javascript] }
                code: { type: string }
                stdin: { type: string }
                test_cases:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      input: { type: string }
                      expected_output: { type: string }
                      hidden: { type: boolean }
                timeout_sec: { type: integer, default: 5 }
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stdout: { type: string }
                      stderr: { type: string }
                      exit_code: { type: integer }
                      duration_ms: { type: integer }
                      memory_kb: { type: integer }
                      all_passed: { type: boolean }
                      test_results:
                        type: array
                        items:
                          type: object
                          properties:
                            test_case: { type: object }
                            actual_output: { type: string }
                            passed: { type: boolean }
                            duration_ms: { type: integer }
        "400": { description: Invalid code or language }
  /sandbox/evaluate:
    post:
      summary: AI-powered code quality and algorithmic complexity analysis (time/space complexity, clean code score)
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, code, problem]
              properties:
                language: { type: string, enum: [go, python, typescript, javascript] }
                code: { type: string }
                problem: { type: string }
      responses:
        "200":
          description: AI Code Review synthesis
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      time_complexity: { type: string }
                      space_complexity: { type: string }
                      quality_score: { type: integer }
                      summary: { type: string }
                      strengths: { type: array, items: { type: string } }
                      improvements: { type: array, items: { type: string } }
        "400": { description: Invalid payload }
  /health:
    get:
      summary: Basic liveness check (200 OK)
      responses:
        "200": { description: OK }
  /ready:
    get:
      summary: Deep readiness probe (checks PostgreSQL, Redis, MinIO)
      responses:
        "200": { description: All dependencies healthy }
        "503": { description: Service Unavailable (dependency degraded) }
  /live:
    get:
      summary: Liveness probe
      responses:
        "200": { description: Process alive }
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        "200": { description: Prometheus plain text metrics }
