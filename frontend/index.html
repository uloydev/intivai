<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the persisted theme before first paint to avoid dark-mode FOUC.
      // Mirrors src/lib/theme.tsx: only an explicit stored "dark" enables dark mode.
      try {
        if (localStorage.getItem("intivai_theme") === "dark") {
          document.documentElement.classList.add("dark")
        }
      } catch (e) {
        console.error("Failed to read persisted theme", e)
      }
    </script>
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
