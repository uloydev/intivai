services:
  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: intivai
      POSTGRES_PASSWORD: intivai
      POSTGRES_DB: intivai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intivai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intivai
      MINIO_ROOT_PASSWORD: intivai123
      # The 2026 minio image defaults MINIO_*_FILE to bare filenames and
      # prefers them over the USER/PASSWORD vars — with no such files the
      # server boots with RANDOM root credentials. Clear the file vars.
      MINIO_ROOT_USER_FILE: ""
      MINIO_ROOT_PASSWORD_FILE: ""
      MINIO_ACCESS_KEY_FILE: ""
      MINIO_SECRET_KEY_FILE: ""
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: intivai-app:latest
    build:
      context: ./backend
    command: ["-migrate-only"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INTIVAI_MIGRATE_URL: postgres://intivai:intivai@postgres:5432/intivai?sslmode=disable
    restart: "no"

  app:
    image: intivai-app:latest
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      INTIVAI_APP_PORT: 8080
      INTIVAI_ENV: dev
      INTIVAI_DATABASE_URL: postgres://intivai_app:intivai_app@postgres:5432/intivai?sslmode=disable
      INTIVAI_REDIS_ADDR: redis:6379
      # Local key lives in .env (gitignored); empty in CI/prod until set.
      INTIVAI_LLM_API_KEY: ${INTIVAI_LLM_API_KEY:-}
      INTIVAI_LLM_BASE_URL: ${INTIVAI_LLM_BASE_URL:-https://ai.sumopod.com/v1}
      INTIVAI_LLM_MODEL: ${INTIVAI_LLM_MODEL:-MiniMax-M2.7-highspeed}
      INTIVAI_LLM_PROVIDER_NAME: ${INTIVAI_LLM_PROVIDER_NAME:-sumopod}
      INTIVAI_MINIO_ENDPOINT: minio:9000
      INTIVAI_MINIO_ACCESS_KEY: intivai
      INTIVAI_MINIO_SECRET_KEY: intivai123
      INTIVAI_MINIO_BUCKET: intivai
      INTIVAI_JWT_SECRET: dev-secret-change-me
      # Dev: load checks (100-conn harness) hit ticket issuance in bursts.
      INTIVAI_RATE_LIMIT_AUTH_PER_MIN: 2000
      INTIVAI_MEMORY_DATA_DIR: /data
      INTIVAI_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      INTIVAI_APP_PUBLIC_URL: ${INTIVAI_APP_PUBLIC_URL:-http://localhost:5173}
      INTIVAI_SMTP_HOST: mailpit
      INTIVAI_SMTP_PORT: 1025
      INTIVAI_SMTP_FROM: "Intivai Talent <no-reply@intivai.com>"
      # Sandbox sidecar (ADR-0002) — the app reaches it over mTLS gRPC.
      INTIVAI_SANDBOX_SIDECAR_ADDR: sandbox-sidecar:8443
      INTIVAI_SANDBOX_CA_CERT: /sandbox-certs/ca.pem
      INTIVAI_SANDBOX_CLIENT_CERT: /sandbox-certs/client.pem
      INTIVAI_SANDBOX_CLIENT_KEY: /sandbox-certs/client-key.pem
      # Tracing (otel-tracing-plan-2026-08-26): off by default everywhere;
      # dev overlay flips on. Fail-soft — collector down never blocks the API.
      INTIVAI_OTEL_ENABLE: ${INTIVAI_OTEL_ENABLE:-false}
      INTIVAI_OTEL_SERVICE_NAME: intivai-server
      INTIVAI_OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      INTIVAI_OTEL_TRACES_SAMPLER_ARG: ${INTIVAI_OTEL_TRACES_SAMPLER_ARG:-1}
    ports:
      - "8080:8080"
    volumes:
      - appdata:/data
      - ./backend/.sandbox-certs:/sandbox-certs:ro

  sandbox-sidecar:
    build:
      context: ./backend
      dockerfile: ./docker/sandboxd/Dockerfile
    environment:
      SANDBOXD_ADDR: :8443
      SANDBOXD_CA: /certs/ca.pem
      SANDBOXD_CERT: /certs/server.pem
      SANDBOXD_KEY: /certs/server-key.pem
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/.sandbox-certs:/certs:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "1025:1025"
      - "8025:8025"

  # Tracing backend (otel-tracing-plan-2026-08-26, D1/D2): all-in-one,
  # in-memory capped at 10k traces. No host ports here — dev overlay exposes
  # the UI; prod stays internal-network only. App never depends_on jaeger
  # (exporter fails soft).
  jaeger:
    image: jaegertracing/jaeger@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    command:
      - --set=extensions.jaeger_storage.backends.some_storage.memory.max_traces=10000
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0
    mem_limit: 512m

  whisper:
    build:
      context: ./backend/docker/whisper
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
  appdata:
