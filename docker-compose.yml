services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: intivai
      POSTGRES_PASSWORD: intivai
      POSTGRES_DB: intivai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intivai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intivai
      MINIO_ROOT_PASSWORD: intivai123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: intivai-app:latest
    build:
      context: ./backend
    command: ["-migrate-only"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INTIVAI_MIGRATE_URL: postgres://intivai:intivai@postgres:5432/intivai?sslmode=disable
    restart: "no"

  app:
    image: intivai-app:latest
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      INTIVAI_APP_PORT: 8080
      INTIVAI_ENV: dev
      INTIVAI_DATABASE_URL: postgres://intivai_app:intivai_app@postgres:5432/intivai?sslmode=disable
      INTIVAI_REDIS_ADDR: redis:6379
      # Local key lives in .env (gitignored); empty in CI/prod until set.
      INTIVAI_DEEPSEEK_API_KEY: ${INTIVAI_DEEPSEEK_API_KEY:-}
      INTIVAI_MINIO_ENDPOINT: minio:9000
      INTIVAI_MINIO_ACCESS_KEY: intivai
      INTIVAI_MINIO_SECRET_KEY: intivai123
      INTIVAI_MINIO_BUCKET: intivai
      INTIVAI_JWT_SECRET: dev-secret-change-me
      INTIVAI_MEMORY_DATA_DIR: /data
      INTIVAI_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - appdata:/data

volumes:
  pgdata:
  miniodata:
  appdata:
