services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: intivai
      POSTGRES_PASSWORD: intivai
      POSTGRES_DB: intivai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intivai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intivai
      MINIO_ROOT_PASSWORD: intivai123
      # The 2026 minio image defaults MINIO_*_FILE to bare filenames and
      # prefers them over the USER/PASSWORD vars — with no such files the
      # server boots with RANDOM root credentials. Clear the file vars.
      MINIO_ROOT_USER_FILE: ""
      MINIO_ROOT_PASSWORD_FILE: ""
      MINIO_ACCESS_KEY_FILE: ""
      MINIO_SECRET_KEY_FILE: ""
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: intivai-app:latest
    build:
      context: ./backend
    command: ["-migrate-only"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INTIVAI_MIGRATE_URL: postgres://intivai:intivai@postgres:5432/intivai?sslmode=disable
    restart: "no"

  app:
    image: intivai-app:latest
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      INTIVAI_APP_PORT: 8080
      INTIVAI_ENV: dev
      INTIVAI_DATABASE_URL: postgres://intivai_app:intivai_app@postgres:5432/intivai?sslmode=disable
      INTIVAI_REDIS_ADDR: redis:6379
      # Local key lives in .env (gitignored); empty in CI/prod until set.
      INTIVAI_DEEPSEEK_API_KEY: ${INTIVAI_DEEPSEEK_API_KEY:-}
      INTIVAI_MINIO_ENDPOINT: minio:9000
      INTIVAI_MINIO_ACCESS_KEY: intivai
      INTIVAI_MINIO_SECRET_KEY: intivai123
      INTIVAI_MINIO_BUCKET: intivai
      INTIVAI_JWT_SECRET: dev-secret-change-me
      # Dev: load checks (100-conn harness) hit ticket issuance in bursts.
      INTIVAI_RATE_LIMIT_AUTH_PER_MIN: 2000
      INTIVAI_MEMORY_DATA_DIR: /data
      INTIVAI_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      INTIVAI_APP_PUBLIC_URL: ${INTIVAI_APP_PUBLIC_URL:-http://localhost:5173}
      INTIVAI_SMTP_HOST: mailpit
      INTIVAI_SMTP_PORT: 1025
      INTIVAI_SMTP_FROM: "Intivai Talent <no-reply@intivai.com>"
      # Sandbox sidecar (ADR-0002) — the app reaches it over mTLS gRPC.
      INTIVAI_SANDBOX_SIDECAR_ADDR: sandbox-sidecar:8443
      INTIVAI_SANDBOX_CA_CERT: /sandbox-certs/ca.pem
      INTIVAI_SANDBOX_CLIENT_CERT: /sandbox-certs/client.pem
      INTIVAI_SANDBOX_CLIENT_KEY: /sandbox-certs/client-key.pem
    ports:
      - "8080:8080"
    volumes:
      - appdata:/data
      - ./backend/.sandbox-certs:/sandbox-certs:ro

  sandbox-sidecar:
    build:
      context: ./backend
      dockerfile: ./docker/sandboxd/Dockerfile
    environment:
      SANDBOXD_ADDR: :8443
      SANDBOXD_CA: /certs/ca.pem
      SANDBOXD_CERT: /certs/server.pem
      SANDBOXD_KEY: /certs/server-key.pem
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/.sandbox-certs:/certs:ro
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  whisper:
    build:
      context: ./backend/docker/whisper
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
  appdata:
