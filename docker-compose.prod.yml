# Production overlay — single VPS (docs: 1 server). Usage:
#   docker compose --env-file .env.prod \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# CRITICAL: compose `environment:` beats `env_file:` — the base file's dev
# environment must be OVERRIDDEN key-by-key here, or prod boots with dev
# secrets (JWT, MinIO, origins). All values interpolate from .env.prod via
# --env-file; `${VAR:?}` fails fast when a required secret is missing.
# !override REPLACES the base port lists (compose v5 appends otherwise).
#
# ROLLBACK (keep last N image tags on the VPS): executable procedure lives in
# docs/runbooks/deploy-rollback.sh (A13); background policy in
# docs/runbooks/rollback.md. In short: re-run compose up -d with TAG set to a
# previous git-sha tag (`docker images ghcr.io/$IMAGE --format '{{.Tag}}'`
# lists candidates). CI tags every deploy image TAG=<git-sha> and pushes
# :latest; `up -d` recreates only changed containers; CI's `docker image
# prune -f` removes <none> layers only, never tagged images.
services:
  migrate:
    image: ghcr.io/${IMAGE:?set IMAGE in .env.prod}:${TAG:?set TAG in .env.prod}
    environment:
      INTIVAI_MIGRATE_URL: ${INTIVAI_MIGRATE_URL:?set in .env.prod}
    restart: "no"

  app:
    image: ghcr.io/${IMAGE:?set IMAGE in .env.prod}:${TAG:?set TAG in .env.prod}
    ports: !override []
    environment:
      INTIVAI_APP_PORT: ${INTIVAI_APP_PORT:-8080}
      INTIVAI_ENV: ${INTIVAI_ENV:-prod}
      INTIVAI_DATABASE_URL: ${INTIVAI_DATABASE_URL:?set in .env.prod}
      INTIVAI_REDIS_ADDR: ${INTIVAI_REDIS_ADDR:-redis:6379}
      INTIVAI_MINIO_ENDPOINT: ${INTIVAI_MINIO_ENDPOINT:-minio:9000}
      INTIVAI_MINIO_ACCESS_KEY: ${INTIVAI_MINIO_ACCESS_KEY:?set in .env.prod}
      INTIVAI_MINIO_SECRET_KEY: ${INTIVAI_MINIO_SECRET_KEY:?set in .env.prod}
      INTIVAI_MINIO_BUCKET: ${INTIVAI_MINIO_BUCKET:-intivai}
      INTIVAI_MINIO_USE_SSL: ${INTIVAI_MINIO_USE_SSL:-false}
      INTIVAI_JWT_SECRET: ${INTIVAI_JWT_SECRET:?set in .env.prod}
      INTIVAI_JWT_EXPIRY_HRS: ${INTIVAI_JWT_EXPIRY_HRS:-12}
      INTIVAI_BCRYPT_COST: ${INTIVAI_BCRYPT_COST:-12}
      INTIVAI_SMTP_HOST: ${INTIVAI_SMTP_HOST:?set in .env.prod}
      INTIVAI_SMTP_PORT: ${INTIVAI_SMTP_PORT:?set in .env.prod}
      INTIVAI_SMTP_USER: ${INTIVAI_SMTP_USER:?set in .env.prod}
      INTIVAI_SMTP_PASS: ${INTIVAI_SMTP_PASS:?set in .env.prod}
      INTIVAI_SMTP_FROM: ${INTIVAI_SMTP_FROM:?set in .env.prod}
      INTIVAI_LLM_API_KEY: ${INTIVAI_LLM_API_KEY:?set in .env.prod}
      INTIVAI_LLM_BASE_URL: ${INTIVAI_LLM_BASE_URL:-https://ai.sumopod.com/v1}
      INTIVAI_LLM_MODEL: ${INTIVAI_LLM_MODEL:-MiniMax-M2.7-highspeed}
      INTIVAI_LLM_MAX_RETRIES: ${INTIVAI_LLM_MAX_RETRIES:-3}
      INTIVAI_ALLOWED_ORIGINS: ${INTIVAI_ALLOWED_ORIGINS:?set in .env.prod}
      INTIVAI_APP_PUBLIC_URL: ${INTIVAI_APP_PUBLIC_URL:?set in .env.prod}
      # OTel (J17): EXPLICIT prod posture — disabled by default (emergency
      # kill switch OTEL_ENABLE=false); if enabled, sampling defaults to 0.1
      # (never inherit the development 1.0 ratio).
      INTIVAI_OTEL_ENABLE: ${INTIVAI_OTEL_ENABLE:-false}
      INTIVAI_OTEL_TRACES_SAMPLER_ARG: ${INTIVAI_OTEL_TRACES_SAMPLER_ARG:-0.1}
      INTIVAI_MEMORY_DRIVER: ${INTIVAI_MEMORY_DRIVER:-postgres}
      INTIVAI_MEMORY_DATA_DIR: ${INTIVAI_MEMORY_DATA_DIR:-/data}
      INTIVAI_EMBEDDINGS_ENABLED: ${INTIVAI_EMBEDDINGS_ENABLED:-false}
      INTIVAI_EMBED_MODEL_DIR: ${INTIVAI_EMBED_MODEL_DIR:-/data/models}
      INTIVAI_RATE_LIMIT_AUTH_PER_MIN: ${INTIVAI_RATE_LIMIT_AUTH_PER_MIN:-10}
      INTIVAI_RATE_LIMIT_TENANT_PER_MIN: ${INTIVAI_RATE_LIMIT_TENANT_PER_MIN:-1000}
      INTIVAI_RATE_LIMIT_USER_PER_MIN: ${INTIVAI_RATE_LIMIT_USER_PER_MIN:-100}
      INTIVAI_SENTRY_DSN: ${INTIVAI_SENTRY_DSN:-}
      INTIVAI_SANDBOX_SIDECAR_ADDR: sandbox-sidecar:8443
      INTIVAI_SANDBOX_CA_CERT: /sandbox-certs/ca.pem
      INTIVAI_SANDBOX_CLIENT_CERT: /sandbox-certs/client.pem
      INTIVAI_SANDBOX_CLIENT_KEY: /sandbox-certs/client-key.pem
    restart: always
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - appdata:/data
      - ./backend/.sandbox-certs:/sandbox-certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      sandbox-sidecar:
        condition: service_healthy

  sandbox-sidecar:
    image: ghcr.io/${IMAGE:?set IMAGE in .env.prod}:${TAG:?set TAG in .env.prod}
    entrypoint: ["sandboxd"]
    environment:
      SANDBOXD_ADDR: :8443
      SANDBOXD_CA: /certs/ca.pem
      SANDBOXD_CERT: /certs/server.pem
      SANDBOXD_KEY: /certs/server-key.pem
      # A12 containment: sandboxd shells out to the docker CLI (runner.go
      # exec.Command("docker")), and the CLI honors DOCKER_HOST natively — so
      # it talks to the least-privilege socket-proxy instead of holding the
      # raw host socket. No /var/run/docker.sock mount here anymore.
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - ./backend/.sandbox-certs:/certs:ro
    restart: always
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:rw,size=32m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8443"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      socket-proxy:
        condition: service_started

  # A12: the docker socket is root-equivalent; only this least-privilege proxy
  # mounts it. sandboxd reaches the daemon through it (CONTAINERS/IMAGES/POST
  # only — no host port published, internal network only). Verify after first
  # deploy that `docker kill` (timeout path) passes through POST=1; if a call
  # is blocked, widen via explicit ALLOW_* vars, never by mounting the socket.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    mem_limit: 64m

  postgres:
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
    restart: always
    mem_limit: 1g

  redis:
    ports: !override []
    restart: always
    command: redis-server --appendonly yes
    # A15: requirepass is DELIBERATELY NOT enabled yet. Verdict 2026-08-24:
    # the app has no Redis auth support — backend/pkg/config/config.go defines
    # Redis{Addr string} only, and pkg/queue/asynq.go builds
    # redis.NewClient(&redis.Options{Addr}) with no Password / ParseURL.
    # Enabling --requirepass ${REDIS_PASSWORD:?} today would brick the queue
    # and WS session registry (auth errors on every command). Follow-up
    # (needs a Go change): accept INTIVAI_REDIS_ADDR in redis://user:pass@host
    # form via go-redis ParseURL, then uncomment the line below and set
    # REDIS_PASSWORD in .env.prod. The compose network is not host-exposed
    # (ports !override []), which is the current compensating control.
    # command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    mem_limit: 512m

  minio:
    ports: !override []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-intivai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.prod}
    restart: always
    mem_limit: 1g

  caddy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: always
    ports: !override ["80:80", "443:443"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_healthy

  mailpit:
    profiles: ["none"]

  # Voice is deferred (D6) — whisper stays out of prod. The dev compose
  # entry remains; this profile pin keeps it from booting here.
  whisper:
    profiles: ["none"]

volumes:
  redisdata:
  caddydata:
  caddyconfig:
