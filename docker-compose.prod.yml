# Production overlay — single VPS (docs: 1 server). Usage:
#   docker compose --env-file .env.prod \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# CRITICAL: compose `environment:` beats `env_file:` — the base file's dev
# environment must be OVERRIDDEN key-by-key here, or prod boots with dev
# secrets (JWT, MinIO, origins). All values interpolate from .env.prod via
# --env-file; `${VAR:?}` fails fast when a required secret is missing.
# !override REPLACES the base port lists (compose v5 appends otherwise).
#
# ROLLBACK (keep last N image tags on the VPS):
#   CI tags every deploy image with TAG=<git-sha> and also pushes :latest.
#   To roll back, point compose at the previous tag and re-up:
#     docker compose --env-file .env.prod -f docker-compose.yml \
#       -f docker-compose.prod.yml up -d \
#       -e IMAGE=<image> -e TAG=<previous-sha>
#   (`up -d` recreates only the changed containers; `docker image prune -f`
#   in CI only removes <none> layers, never tagged images.) Keep the last 5
#   TAGs available locally; `docker images ghcr.io/<IMAGE> --format '{{.Tag}}'`
#   lists what you can roll back to.
services:
  migrate:
    image: ghcr.io/${IMAGE:-intivai/backend}:${TAG:-latest}
    environment:
      INTIVAI_MIGRATE_URL: ${INTIVAI_MIGRATE_URL:?set in .env.prod}
    restart: "no"

  app:
    image: ghcr.io/${IMAGE:-intivai/backend}:${TAG:-latest}
    ports: !override []
    environment:
      INTIVAI_APP_PORT: ${INTIVAI_APP_PORT:-8080}
      INTIVAI_ENV: ${INTIVAI_ENV:-prod}
      INTIVAI_DATABASE_URL: ${INTIVAI_DATABASE_URL:?set in .env.prod}
      INTIVAI_REDIS_ADDR: ${INTIVAI_REDIS_ADDR:-redis:6379}
      INTIVAI_MINIO_ENDPOINT: ${INTIVAI_MINIO_ENDPOINT:-minio:9000}
      INTIVAI_MINIO_ACCESS_KEY: ${INTIVAI_MINIO_ACCESS_KEY:?set in .env.prod}
      INTIVAI_MINIO_SECRET_KEY: ${INTIVAI_MINIO_SECRET_KEY:?set in .env.prod}
      INTIVAI_MINIO_BUCKET: ${INTIVAI_MINIO_BUCKET:-intivai}
      INTIVAI_MINIO_USE_SSL: ${INTIVAI_MINIO_USE_SSL:-false}
      INTIVAI_JWT_SECRET: ${INTIVAI_JWT_SECRET:?set in .env.prod}
      INTIVAI_JWT_EXPIRY_HRS: ${INTIVAI_JWT_EXPIRY_HRS:-12}
      INTIVAI_BCRYPT_COST: ${INTIVAI_BCRYPT_COST:-12}
      INTIVAI_SMTP_HOST: ${INTIVAI_SMTP_HOST:?set in .env.prod}
      INTIVAI_SMTP_PORT: ${INTIVAI_SMTP_PORT:?set in .env.prod}
      INTIVAI_SMTP_USER: ${INTIVAI_SMTP_USER:?set in .env.prod}
      INTIVAI_SMTP_PASS: ${INTIVAI_SMTP_PASS:?set in .env.prod}
      INTIVAI_SMTP_FROM: ${INTIVAI_SMTP_FROM:?set in .env.prod}
      INTIVAI_DEEPSEEK_API_KEY: ${INTIVAI_DEEPSEEK_API_KEY:-}
      INTIVAI_DEEPSEEK_BASE_URL: ${INTIVAI_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      INTIVAI_DEEPSEEK_MODEL: ${INTIVAI_DEEPSEEK_MODEL:-deepseek-chat}
      INTIVAI_LLM_MAX_RETRIES: ${INTIVAI_LLM_MAX_RETRIES:-3}
      INTIVAI_ALLOWED_ORIGINS: ${INTIVAI_ALLOWED_ORIGINS:?set in .env.prod}
      INTIVAI_APP_PUBLIC_URL: ${INTIVAI_APP_PUBLIC_URL:?set in .env.prod}
      INTIVAI_MEMORY_DRIVER: ${INTIVAI_MEMORY_DRIVER:-postgres}
      INTIVAI_MEMORY_DATA_DIR: ${INTIVAI_MEMORY_DATA_DIR:-/data}
      INTIVAI_EMBEDDINGS_ENABLED: ${INTIVAI_EMBEDDINGS_ENABLED:-false}
      INTIVAI_EMBED_MODEL_DIR: ${INTIVAI_EMBED_MODEL_DIR:-/data/models}
      INTIVAI_RATE_LIMIT_AUTH_PER_MIN: ${INTIVAI_RATE_LIMIT_AUTH_PER_MIN:-10}
      INTIVAI_RATE_LIMIT_TENANT_PER_MIN: ${INTIVAI_RATE_LIMIT_TENANT_PER_MIN:-1000}
      INTIVAI_RATE_LIMIT_USER_PER_MIN: ${INTIVAI_RATE_LIMIT_USER_PER_MIN:-100}
      INTIVAI_SENTRY_DSN: ${INTIVAI_SENTRY_DSN:-}
      INTIVAI_SANDBOX_SIDECAR_ADDR: sandbox-sidecar:8443
      INTIVAI_SANDBOX_CA_CERT: /sandbox-certs/ca.pem
      INTIVAI_SANDBOX_CLIENT_CERT: /sandbox-certs/client.pem
      INTIVAI_SANDBOX_CLIENT_KEY: /sandbox-certs/client-key.pem
    restart: always
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - appdata:/data
      - ./backend/.sandbox-certs:/sandbox-certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      sandbox-sidecar:
        condition: service_healthy

  sandbox-sidecar:
    image: ghcr.io/${IMAGE:-intivai/backend}:${TAG:-latest}
    entrypoint: ["sandboxd"]
    environment:
      SANDBOXD_ADDR: :8443
      SANDBOXD_CA: /certs/ca.pem
      SANDBOXD_CERT: /certs/server.pem
      SANDBOXD_KEY: /certs/server-key.pem
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/.sandbox-certs:/certs:ro
    restart: always
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8443"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
    restart: always
    mem_limit: 1g

  redis:
    ports: !override []
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    mem_limit: 512m

  minio:
    ports: !override []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-intivai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.prod}
    restart: always
    mem_limit: 1g

  caddy:
    image: caddy:2-alpine
    restart: always
    ports: !override ["80:80", "443:443"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_healthy

  mailpit:
    profiles: ["none"]

  # Voice is deferred (D6) — whisper stays out of prod. The dev compose
  # entry remains; this profile pin keeps it from booting here.
  whisper:
    profiles: ["none"]

volumes:
  redisdata:
  caddydata:
  caddyconfig:
