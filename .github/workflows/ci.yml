name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
          working-directory: backend

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test (race detector)
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx vitest run

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: intivai
          POSTGRES_PASSWORD: intivai
          POSTGRES_DB: intivai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intivai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          # clear image-default MINIO_*_FILE vars (files absent → random creds)
          MINIO_ROOT_USER_FILE: ""
          MINIO_ROOT_PASSWORD_FILE: ""
          MINIO_ACCESS_KEY_FILE: ""
          MINIO_SECRET_KEY_FILE: ""
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Migrate (admin)
        run: go run ./cmd/server -migrate-only
        env:
          INTIVAI_MIGRATE_URL: postgres://intivai:intivai@localhost:5432/intivai?sslmode=disable

      - name: Integration tests (as intivai_app, real RLS)
        run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://intivai_app:intivai_app@localhost:5432/intivai?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
          TEST_MINIO_ENDPOINT: localhost:9000
          TEST_MINIO_ACCESS: minioadmin
          TEST_MINIO_SECRET: minioadmin

      - name: Coverage gate
        run: bash ../scripts/check-coverage.sh
        env:
          TEST_DATABASE_URL: postgres://intivai_app:intivai_app@localhost:5432/intivai?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
          TEST_MINIO_ENDPOINT: localhost:9000
          TEST_MINIO_ACCESS: minioadmin
          TEST_MINIO_SECRET: minioadmin

  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot stack (docker compose, default ports free on runner)
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { echo "app not healthy"; exit 1; }

      - name: Generate CV fixture
        run: |
          python3 - <<'EOF'
          content = 'Senior Go engineer with PostgreSQL and Kubernetes experience, 5 years, Master degree'
          stream = 'BT /F1 12 Tf 72 720 Td (' + content + ') Tj ET'
          open('/tmp/cv.pdf','w').write(f'''%PDF-1.4
          1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj
          2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj
          3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >> endobj
          4 0 obj << /Length {len(stream)} >> stream
          {stream}
          endstream endobj
          5 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj
          xref
          0 6
          0000000000 65535 f 
          trailer << /Size 6 /Root 1 0 R >>
          startxref
          0
          %%EOF''')

      - name: Smoke scenario
        env:
          INTIVAI_DEEPSEEK_API_KEY: ${{ secrets.INTIVAI_DEEPSEEK_API_KEY }}
          BASE: http://localhost:8081/api/v1
        run: |
          pip3 install --quiet websocket-client
          bash scripts/smoke.sh /tmp/cv.pdf

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    needs: [backend, backend-integration, backend-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Build + push backend image (ghcr)
        env:
          REGISTRY: ghcr.io
        run: |
          IMAGE=$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')/backend
          echo "IMAGE=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/${IMAGE}:${{ steps.tag.outputs.tag }} ./backend
          docker tag ghcr.io/${IMAGE}:${{ steps.tag.outputs.tag }} ghcr.io/${IMAGE}:latest
          docker push ghcr.io/${IMAGE}:${{ steps.tag.outputs.tag }}
          docker push ghcr.io/${IMAGE}:latest
        id: image

      - name: Build + push sandbox images
        run: |
          IMAGE=${{ steps.image.outputs.IMAGE }}
          for lang in go python node ts; do
            img="ghcr.io/${IMAGE}-sandbox-${lang}"
            docker build -t $img:${{ steps.tag.outputs.tag }} ./docker/sandbox/$lang
            docker tag $img:${{ steps.tag.outputs.tag }} $img:latest
            docker push $img:${{ steps.tag.outputs.tag }}
            docker push $img:latest
          done

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Ship frontend dist
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "frontend/dist/*"
          target: /opt/intivai/frontend/dist

      - name: Deploy to VPS (compose pull + migrate + app)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/intivai
            export TAG=${{ steps.tag.outputs.tag }}
            export IMAGE=${{ steps.image.outputs.IMAGE }}
            
            for lang in go python node ts; do
              docker pull ghcr.io/${IMAGE}-sandbox-${lang}:${TAG}
              docker tag ghcr.io/${IMAGE}-sandbox-${lang}:${TAG} intivai-sandbox-${lang}:latest
            done
            
            bash scripts/gen-sandbox-certs.sh
            
            docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml pull app migrate
            docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d migrate
            docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d app
            docker image prune -f
